<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyber Gravity — Lab</title>
  <meta name="description" content="Simulador de Gravedad N-Cuerpos y Órbitas Planetarias con estética Neón." />
  <link rel="icon" type="image/png" href="../favicon.png" />
  <link rel="shortcut icon" type="image/png" href="../favicon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cyan: '#00fff0',
            magenta: '#ff00c8',
            accent: '#00ff87',
            'accent-dim': '#00cc6a',
            surface: '#080810',
            's1': '#0e0e18',
            's2': '#13131f',
            's3': '#1a1a28',
            's4': '#222235',
            border: '#2a2a40',
            'tp': '#eeeeff',
            'ts': '#7878a0',
            'tm': '#44445a',
          },
          fontFamily: {
            mono: ['"JetBrains Mono"', 'monospace'],
            sans: ['"Inter"', 'system-ui', 'sans-serif'],
          },
          animation: {
            'blink': 'blink 1.1s step-end infinite',
            'pulse-slow': 'pulse 3s ease-in-out infinite',
            'scan': 'scan 8s linear infinite',
            'glitch': 'glitch 4s infinite',
          },
        },
      },
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --green: #00ff87;
      --cyan: #00fff0;
      --magenta: #ff00c8;
      --bg: #080810;
    }
    html { scroll-behavior: smooth; }
    body {
      background-color: var(--bg);
      color: #eeeeff;
      font-family: 'Inter', system-ui, sans-serif;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #0a0a12; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(var(--green), var(--cyan)); border-radius: 2px; }
    ::selection { background: rgba(0, 255, 240, 0.2); color: #fff; }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(to bottom, transparent 0px, transparent 2px, rgba(0, 0, 0, 0.06) 2px, rgba(0, 0, 0, 0.06) 3px);
      pointer-events: none;
      z-index: 9998;
    }
    .scan-line {
      position: fixed; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent 0%, var(--cyan) 40%, var(--green) 60%, transparent 100%);
      opacity: 0.06; animation: scan 12s linear infinite; pointer-events: none; z-index: 9997;
    }
    .cyber-grid {
      background-image: linear-gradient(rgba(0, 255, 240, 0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 240, 0.025) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    .glitch {
      position: relative; display: inline-block; color: var(--green);
      text-shadow: 0 0 30px rgba(0, 255, 135, 0.5), 0 0 60px rgba(0, 255, 135, 0.2);
    }
    .glitch::before, .glitch::after {
      content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    }
    .glitch::before { color: var(--magenta); animation: glitch-1 4s infinite; clip-path: inset(0 0 100% 0); }
    .glitch::after { color: var(--cyan); animation: glitch-2 4s infinite; clip-path: inset(0 0 100% 0); }
    @keyframes glitch-1 {
      0%, 89%, 100% { clip-path: inset(0 0 100% 0); transform: translate(0); }
      90% { clip-path: inset(15% 0 55% 0); transform: translate(-3px, 2px); }
      92% { clip-path: inset(65% 0 5% 0); transform: translate(3px, -1px); }
      94% { clip-path: inset(35% 0 35% 0); transform: translate(-2px, 3px); }
      96% { clip-path: inset(80% 0 2% 0); transform: translate(2px, -2px); }
    }
    @keyframes glitch-2 {
      0%, 91%, 100% { clip-path: inset(0 0 100% 0); transform: translate(0); }
      92% { clip-path: inset(50% 0 25% 0); transform: translate(3px, -2px); }
      94% { clip-path: inset(10% 0 70% 0); transform: translate(-3px, 2px); }
      96% { clip-path: inset(70% 0 8% 0); transform: translate(2px, -1px); }
      98% { clip-path: inset(25% 0 50% 0); transform: translate(-2px, 2px); }
    }
    .neon-green { color: var(--green); text-shadow: 0 0 8px rgba(0, 255, 135, 0.6); }
    .neon-cyan { color: var(--cyan); text-shadow: 0 0 8px rgba(0, 255, 240, 0.6); }
    .neon-mag { color: var(--magenta); text-shadow: 0 0 8px rgba(255, 0, 200, 0.6); }

    .btn-ctl {
      padding: 6px 14px; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;
      border-radius: 4px; border: 1px solid #2a2a40; background: #13131f; color: #eeeeff;
      cursor: pointer; transition: all 0.2s ease;
    }
    .btn-ctl:hover, .btn-ctl.active {
      border-color: var(--cyan); background: rgba(0, 255, 240, 0.15); color: #fff;
      box-shadow: 0 0 10px rgba(0, 255, 240, 0.3);
    }
  </style>
</head>
<body class="cyber-grid min-h-screen flex flex-col">
  <div class="scan-line"></div>
  <header id="navbar" class="fixed top-0 inset-x-0 z-50 transition-all duration-300" style="background:rgba(8,8,16,0.82);backdrop-filter:blur(18px);border-bottom:1px solid rgba(0,255,240,0.07);">
    <nav class="max-w-6xl mx-auto px-5 sm:px-8 h-14 flex items-center justify-between">
      <a href="../index.html" class="font-mono font-bold tracking-widest flex items-center gap-1 text-sm text-cyan hover:text-green transition-colors">
        <span>&lt;- Volver al Lab</span>
      </a>
      <a href="https://enmanuel.tech" class="font-mono font-bold tracking-widest flex items-center gap-1 text-sm">
        <span style="color:#44445a">[</span><span class="neon-green">Cardoza</span><span style="color:#44445a">.</span><span class="neon-cyan">Dev</span><span class="animate-blink" style="color:#00ff87">_</span><span style="color:#44445a">]</span>
      </a>
    </nav>
  </header>

  <main class="pt-20 pb-10 max-w-5xl w-full mx-auto px-4 flex flex-col items-center">
    <div class="text-center mb-4">
      <h1 class="font-mono font-bold leading-none mb-2" style="font-size:clamp(1.8rem,5vw,3rem);">
        <span class="glitch" data-text="Orbit Sandbox / Gravedad N-Cuerpos">Orbit Sandbox / Gravedad N-Cuerpos</span>
      </h1>
      <p class="text-ts font-mono text-xs sm:text-sm">
        Simulador de física gravitacional. Arrastra para lanzar cuerpos celestes con vector de velocidad.
      </p>
    </div>

    <!-- Control Bar -->
    <div class="w-full bg-[#0e0e1a]/95 border border-[#1e1e32] rounded-lg p-3 sm:p-4 mb-4 flex flex-wrap gap-3 items-center justify-between font-mono text-xs shadow-lg">
      <div class="flex flex-wrap gap-2 items-center">
        <button id="btnPause" class="btn-ctl active">Pausar</button>
        <button id="btnClear" class="btn-ctl" style="border-color:#ff00c8;color:#ff66e0;">Limpiar</button>
        
        <div class="flex items-center gap-2 ml-1">
          <label class="text-ts">Escenario:</label>
          <select id="presetSelect" class="bg-[#13131f] text-tp border border-[#2a2a40] rounded px-2 py-1.5 focus:border-cyan outline-none">
            <option value="solar">Sistema Solar</option>
            <option value="threeBody">Problema de los 3 Cuerpos</option>
            <option value="blackhole">Agujero Negro Central</option>
            <option value="binary">Estrellas Binarias</option>
          </select>
        </div>
      </div>

      <div class="flex flex-wrap gap-4 items-center">
        <div class="flex items-center gap-2">
          <label class="text-ts">Masa Nueva:</label>
          <select id="massSelect" class="bg-[#13131f] text-accent border border-[#2a2a40] rounded px-2 py-1.5 focus:border-accent outline-none">
            <option value="5">Planeta Pequeño (5)</option>
            <option value="25" selected>Planeta Gigante (25)</option>
            <option value="350">Estrella Solar (350)</option>
            <option value="2500">Agujero Negro (2500)</option>
          </select>
        </div>

        <div class="flex items-center gap-2">
          <label class="text-ts">Rastros:</label>
          <input id="trailsToggle" type="checkbox" checked class="accent-cyan cursor-pointer w-4 h-4" />
        </div>
      </div>
    </div>

    <!-- Canvas Sandbox -->
    <div class="relative w-full overflow-hidden border border-cyan/40 rounded-lg shadow-[0_0_35px_rgba(0,255,240,0.12)] bg-[#030306]">
      <canvas id="gravityCanvas" class="cursor-crosshair block w-full"></canvas>
    </div>

    <p class="font-mono text-ts text-xs mt-4 text-center">
      Haz clic y arrastra sobre el espacio para definir la posición y la velocidad orbital de un nuevo astro.
    </p>
  </main>

  <script>
    const canvas = document.getElementById('gravityCanvas');
    const ctx = canvas.getContext('2d');
    const btnPause = document.getElementById('btnPause');
    const btnClear = document.getElementById('btnClear');
    const presetSelect = document.getElementById('presetSelect');
    const massSelect = document.getElementById('massSelect');
    const trailsToggle = document.getElementById('trailsToggle');

    let isRunning = true;
    let G = 0.8; // Gravitational constant
    let bodies = [];
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let dragCurrent = { x: 0, y: 0 };

    const COLORS = ['#00fff0', '#00ff87', '#ff00c8', '#ffbd2e', '#9d00ff', '#ffffff'];

    function resizeCanvas() {
      const w = canvas.parentElement.clientWidth;
      const h = Math.max(460, Math.floor(window.innerHeight * 0.58));
      canvas.width = w;
      canvas.height = h;
    }

    class Body {
      constructor(x, y, vx, vy, mass, color) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.mass = mass;
        this.radius = Math.max(3, Math.sqrt(mass) * 1.3);
        this.color = color || COLORS[Math.floor(Math.random() * COLORS.length)];
        this.trail = [];
      }

      updateTrail() {
        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > 50) this.trail.shift();
      }

      drawTrail() {
        if (!trailsToggle.checked || this.trail.length < 2) return;
        ctx.beginPath();
        ctx.strokeStyle = this.color;
        for (let i = 0; i < this.trail.length - 1; i++) {
          const pt = this.trail[i];
          const nextPt = this.trail[i + 1];
          ctx.globalAlpha = (i / this.trail.length) * 0.4;
          ctx.moveTo(pt.x, pt.y);
          ctx.lineTo(nextPt.x, nextPt.y);
        }
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      draw() {
        this.drawTrail();

        ctx.save();
        ctx.shadowBlur = Math.min(30, this.radius * 2);
        ctx.shadowColor = this.color;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function initPreset(name) {
      bodies = [];
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      if (name === 'solar') {
        // Sun
        bodies.push(new Body(cx, cy, 0, 0, 600, '#ffbd2e'));
        // Planets
        bodies.push(new Body(cx, cy - 90, 2.3, 0, 15, '#00fff0'));
        bodies.push(new Body(cx, cy - 160, 1.8, 0, 25, '#00ff87'));
        bodies.push(new Body(cx, cy + 240, -1.4, 0, 40, '#ff00c8'));
        // Moon orbiting planet 2
        bodies.push(new Body(cx, cy - 175, 2.7, 0, 2, '#ffffff'));
      } else if (name === 'threeBody') {
        // Chaotic 3-body system
        bodies.push(new Body(cx - 100, cy, 0, 1.4, 250, '#00fff0'));
        bodies.push(new Body(cx + 100, cy, 0, -1.4, 250, '#ff00c8'));
        bodies.push(new Body(cx, cy - 120, -1.2, 0, 250, '#00ff87'));
      } else if (name === 'blackhole') {
        bodies.push(new Body(cx, cy, 0, 0, 2200, '#ffffff'));
        for (let i = 0; i < 18; i++) {
          const angle = (i / 18) * Math.PI * 2;
          const dist = 120 + Math.random() * 180;
          const v = Math.sqrt((G * 2200) / dist);
          const px = cx + Math.cos(angle) * dist;
          const py = cy + Math.sin(angle) * dist;
          const vx = -Math.sin(angle) * v;
          const vy = Math.cos(angle) * v;
          bodies.push(new Body(px, py, vx, vy, Math.random() * 8 + 3));
        }
      } else if (name === 'binary') {
        // Binary star dance
        bodies.push(new Body(cx - 70, cy, 0, 1.8, 450, '#00fff0'));
        bodies.push(new Body(cx + 70, cy, 0, -1.8, 450, '#ff00c8'));
        bodies.push(new Body(cx, cy - 220, 2.0, 0, 10, '#00ff87'));
      }
    }

    function updatePhysics() {
      const dt = 1;

      for (let i = 0; i < bodies.length; i++) {
        for (let j = i + 1; j < bodies.length; j++) {
          const b1 = bodies[i];
          const b2 = bodies[j];

          const dx = b2.x - b1.x;
          const dy = b2.y - b1.y;
          const distSq = dx * dx + dy * dy;
          const dist = Math.sqrt(distSq);

          // Collision handling
          if (dist < b1.radius + b2.radius) {
            // Merge bodies
            const totalMass = b1.mass + b2.mass;
            b1.vx = (b1.vx * b1.mass + b2.vx * b2.mass) / totalMass;
            b1.vy = (b1.vy * b1.mass + b2.vy * b2.mass) / totalMass;
            b1.mass = totalMass;
            b1.radius = Math.max(3, Math.sqrt(totalMass) * 1.3);
            bodies.splice(j, 1);
            j--;
            continue;
          }

          const force = (G * b1.mass * b2.mass) / Math.max(distSq, 100);
          const fx = force * (dx / dist);
          const fy = force * (dy / dist);

          b1.vx += (fx / b1.mass) * dt;
          b1.vy += (fy / b1.mass) * dt;
          b2.vx -= (fx / b2.mass) * dt;
          b2.vy -= (fy / b2.mass) * dt;
        }
      }

      bodies.forEach(b => {
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.updateTrail();
      });
    }

    function draw() {
      ctx.fillStyle = '#030306';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Orbital Grid effect
      ctx.strokeStyle = 'rgba(0, 255, 240, 0.02)';
      ctx.lineWidth = 1;
      const step = 40;
      for (let x = 0; x < canvas.width; x += step) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += step) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      bodies.forEach(b => b.draw());

      // Slingshot vector line
      if (isDragging) {
        ctx.strokeStyle = '#00fff0';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(dragStart.x, dragStart.y);
        ctx.lineTo(dragCurrent.x, dragCurrent.y);
        ctx.stroke();
        ctx.setLineDash([]);

        // Preview body
        ctx.fillStyle = 'rgba(0, 255, 240, 0.6)';
        ctx.beginPath();
        const m = parseFloat(massSelect.value);
        const r = Math.max(3, Math.sqrt(m) * 1.3);
        ctx.arc(dragStart.x, dragStart.y, r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function loop() {
      if (isRunning) {
        updatePhysics();
      }
      draw();
      requestAnimationFrame(loop);
    }

    btnPause.addEventListener('click', () => {
      isRunning = !isRunning;
      btnPause.textContent = isRunning ? 'Pausar' : 'Reanudar';
      btnPause.classList.toggle('active', isRunning);
    });

    btnClear.addEventListener('click', () => {
      bodies = [];
    });

    presetSelect.addEventListener('change', (e) => {
      initPreset(e.target.value);
    });

    // Mouse / Touch interaction for slingshot creation
    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    canvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      dragStart = getPos(e);
      dragCurrent = { ...dragStart };
    });

    canvas.addEventListener('mousemove', (e) => {
      if (isDragging) dragCurrent = getPos(e);
    });

    window.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        const vx = (dragStart.x - dragCurrent.x) * 0.04;
        const vy = (dragStart.y - dragCurrent.y) * 0.04;
        const mass = parseFloat(massSelect.value);
        bodies.push(new Body(dragStart.x, dragStart.y, vx, vy, mass));
      }
    });

    // Touch
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      isDragging = true;
      dragStart = getPos(e);
      dragCurrent = { ...dragStart };
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      if (isDragging) {
        e.preventDefault();
        dragCurrent = getPos(e);
      }
    }, { passive: false });

    window.addEventListener('touchend', () => {
      if (isDragging) {
        isDragging = false;
        const vx = (dragStart.x - dragCurrent.x) * 0.04;
        const vy = (dragStart.y - dragCurrent.y) * 0.04;
        const mass = parseFloat(massSelect.value);
        bodies.push(new Body(dragStart.x, dragStart.y, vx, vy, mass));
      }
    });

    window.addEventListener('resize', () => {
      resizeCanvas();
    });

    resizeCanvas();
    initPreset('solar');
    loop();
  </script>
</body>
</html>
