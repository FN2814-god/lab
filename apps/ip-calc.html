<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPv4 Subnet Calculator — Lab</title>
  <meta name="description" content="Calculadora de Subredes IPv4." />
  <link rel="icon" type="image/png" href="../favicon.png" />
  <link rel="shortcut icon" type="image/png" href="../favicon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cyan: '#00fff0',
            magenta: '#ff00c8',
            accent: '#00ff87',
            'accent-dim': '#00cc6a',
            surface: '#080810',
            's1': '#0e0e18',
            's2': '#13131f',
            's3': '#1a1a28',
            's4': '#222235',
            border: '#2a2a40',
            'tp': '#eeeeff',
            'ts': '#7878a0',
            'tm': '#44445a',
          },
          fontFamily: {
            mono: ['"JetBrains Mono"', 'monospace'],
            sans: ['"Inter"', 'system-ui', 'sans-serif'],
          },
          animation: {
            'blink': 'blink 1.1s step-end infinite',
            'pulse-slow': 'pulse 3s ease-in-out infinite',
            'scan': 'scan 8s linear infinite',
            'glitch': 'glitch 4s infinite',
          },
          keyframes: {
            blink: { '0%,100%': { opacity: '1' }, '50%': { opacity: '0' } },
            scan: { '0%': { transform: 'translateY(-100%)' }, '100%': { transform: 'translateY(100vh)' } },
            glitch: {
              '0%,90%,100%': { clipPath: 'inset(0 0 100% 0)', transform: 'translate(0)' },
              '92%': { clipPath: 'inset(20% 0 50% 0)', transform: 'translate(-3px, 2px)', color: '#ff00c8' },
              '94%': { clipPath: 'inset(60% 0 10% 0)', transform: 'translate(3px, -2px)', color: '#00fff0' },
              '96%': { clipPath: 'inset(40% 0 30% 0)', transform: 'translate(-2px, 1px)', color: '#00ff87' },
              '98%': { clipPath: 'inset(0 0 70% 0)', transform: 'translate(2px, -1px)' },
            },
          },
        },
      },
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --green: #00ff87;
      --cyan: #00fff0;
      --magenta: #ff00c8;
      --bg: #080810;
    }
    html { scroll-behavior: smooth; }
    body {
      background-color: var(--bg);
      color: #eeeeff;
      font-family: 'Inter', system-ui, sans-serif;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: #0a0a12; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(var(--green), var(--cyan)); border-radius: 2px; }
    ::selection { background: rgba(0, 255, 240, 0.2); color: #fff; }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(to bottom, transparent 0px, transparent 2px, rgba(0, 0, 0, 0.06) 2px, rgba(0, 0, 0, 0.06) 3px);
      pointer-events: none;
      z-index: 9998;
    }
    .scan-line {
      position: fixed; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent 0%, var(--cyan) 40%, var(--green) 60%, transparent 100%);
      opacity: 0.06; animation: scan 12s linear infinite; pointer-events: none; z-index: 9997;
    }
    .cyber-grid {
      background-image: linear-gradient(rgba(0, 255, 240, 0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 240, 0.025) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    .glitch {
      position: relative; display: inline-block; color: var(--green);
      text-shadow: 0 0 30px rgba(0, 255, 135, 0.5), 0 0 60px rgba(0, 255, 135, 0.2);
    }
    .glitch::before, .glitch::after {
      content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    }
    .glitch::before { color: var(--magenta); animation: glitch-1 4s infinite; clip-path: inset(0 0 100% 0); }
    .glitch::after { color: var(--cyan); animation: glitch-2 4s infinite; clip-path: inset(0 0 100% 0); }
    @keyframes glitch-1 {
      0%, 89%, 100% { clip-path: inset(0 0 100% 0); transform: translate(0); }
      90% { clip-path: inset(15% 0 55% 0); transform: translate(-3px, 2px); }
      92% { clip-path: inset(65% 0 5% 0); transform: translate(3px, -1px); }
      94% { clip-path: inset(35% 0 35% 0); transform: translate(-2px, 3px); }
      96% { clip-path: inset(80% 0 2% 0); transform: translate(2px, -2px); }
    }
    @keyframes glitch-2 {
      0%, 91%, 100% { clip-path: inset(0 0 100% 0); transform: translate(0); }
      92% { clip-path: inset(50% 0 25% 0); transform: translate(3px, -2px); }
      94% { clip-path: inset(10% 0 70% 0); transform: translate(-3px, 2px); }
      96% { clip-path: inset(70% 0 8% 0); transform: translate(2px, -1px); }
      98% { clip-path: inset(25% 0 50% 0); transform: translate(-2px, 2px); }
    }
    .neon-green { color: var(--green); text-shadow: 0 0 8px rgba(0, 255, 135, 0.6), 0 0 20px rgba(0, 255, 135, 0.3); }
    .neon-cyan { color: var(--cyan); text-shadow: 0 0 8px rgba(0, 255, 240, 0.6), 0 0 20px rgba(0, 255, 240, 0.3); }
    .btn-primary {
      display: inline-flex; align-items: center; gap: 8px; padding: 11px 28px;
      background: linear-gradient(135deg, var(--green) 0%, var(--cyan) 100%); color: #000;
      font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; font-weight: 700; border-radius: 4px;
      border: none; cursor: pointer; transition: all 0.25s ease; text-decoration: none;
      clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
    }
    .btn-primary:hover { box-shadow: 0 0 28px rgba(0, 255, 135, 0.5), 0 0 60px rgba(0, 255, 240, 0.2); transform: translateY(-2px); filter: brightness(1.1); }
    .tdot { display: inline-block; border-radius: 50%; width: 10px; height: 10px; }
  </style>
</head>
<body class="cyber-grid">
  <div class="scan-line"></div>
  <header id="navbar" class="fixed top-0 inset-x-0 z-50 transition-all duration-300" style="background:rgba(8,8,16,0.82);backdrop-filter:blur(18px);border-bottom:1px solid rgba(0,255,240,0.07);">
    <nav class="max-w-6xl mx-auto px-5 sm:px-8 h-14 flex items-center justify-between">
      <a href="../index.html" class="font-mono font-bold tracking-widest flex items-center gap-1 text-sm text-cyan hover:text-green transition-colors">
        <span>&lt;- Volver al Lab</span>
      </a>
      <a href="https://enmanuel.tech" class="font-mono font-bold tracking-widest flex items-center gap-1 text-sm">
        <span style="color:#44445a">[</span><span class="neon-green">Cardoza</span><span style="color:#44445a">.</span><span class="neon-cyan">Dev</span><span class="animate-blink" style="color:#00ff87">_</span><span style="color:#44445a">]</span>
      </a>
    </nav>
  </header>

  <main class="pt-24 pb-12 max-w-3xl mx-auto px-5">
    <h1 class="font-mono font-bold leading-none mb-8 text-center" style="font-size:clamp(2rem,6vw,3.5rem);">
      <span class="glitch" data-text="IPv4 Subnet Calculator">IPv4 Subnet Calculator</span>
    </h1>
    
    <div class="bg-[#0e0e1a] border border-[#2a2a40] rounded-lg p-6 mb-8 shadow-[0_0_20px_rgba(0,255,240,0.05)] relative z-10">
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 items-end">
        <div class="sm:col-span-2">
          <label class="block font-mono text-cyan text-xs uppercase mb-2">Dirección IP</label>
          <input type="text" id="ip-input" placeholder="Ej: 192.168.1.10" class="w-full bg-[#050508] border border-[#2a2a40] text-[#eeeeff] font-mono px-4 py-3 rounded-md focus:border-accent focus:shadow-[0_0_10px_rgba(0,255,135,0.3)] outline-none transition-all">
        </div>
        <div>
          <label class="block font-mono text-cyan text-xs uppercase mb-2">CIDR</label>
          <select id="cidr-input" class="w-full bg-[#050508] border border-[#2a2a40] text-[#eeeeff] font-mono px-4 py-3 rounded-md focus:border-accent focus:shadow-[0_0_10px_rgba(0,255,135,0.3)] outline-none transition-all">
            <!-- options will be injected via JS -->
          </select>
        </div>
      </div>
      <div class="mt-6 flex justify-end">
        <button id="calc-btn" class="btn-primary">Calcular</button>
      </div>
    </div>

    <!-- Panel de Resultados -->
    <div class="bg-[#050508] border border-cyan/30 rounded-lg p-6 font-mono text-sm shadow-[0_0_15px_rgba(0,255,240,0.1)] relative overflow-hidden z-10">
      <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-cyan to-transparent opacity-50"></div>
      <div class="flex items-center gap-2 mb-4 text-[#44445a]">
        <span class="tdot bg-red-500"></span><span class="tdot bg-yellow-400"></span><span class="tdot bg-green-500"></span>
      </div>
      <div id="results" class="text-green space-y-3">
        <p><span class="text-ts">Esperando entrada...</span></p>
      </div>
    </div>
  </main>

  <script>
    // Populate CIDR
    const cidrSelect = document.getElementById('cidr-input');
    for(let i = 8; i <= 32; i++) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = '/' + i;
      if(i === 24) opt.selected = true;
      cidrSelect.appendChild(opt);
    }

    document.getElementById('calc-btn').addEventListener('click', () => {
      const ipStr = document.getElementById('ip-input').value.trim();
      const cidr = parseInt(document.getElementById('cidr-input').value);
      const resultsDiv = document.getElementById('results');

      // Validate IP
      const ipParts = ipStr.split('.');
      if (ipParts.length !== 4 || ipParts.some(p => isNaN(p) || p < 0 || p > 255 || p === '')) {
        resultsDiv.innerHTML = '<p class="text-red-500">Error: Dirección IP inválida.</p>';
        return;
      }

      // Calculate
      const ipNum = ipParts.reduce((acc, part) => (acc << 8) + parseInt(part), 0) >>> 0;
      const maskNum = (0xFFFFFFFF << (32 - cidr)) >>> 0;
      const netNum = (ipNum & maskNum) >>> 0;
      const bcNum = (netNum | ~maskNum) >>> 0;

      const numToIp = (num) => [
        (num >>> 24) & 255,
        (num >>> 16) & 255,
        (num >>> 8) & 255,
        num & 255
      ].join('.');

      const maskIp = numToIp(maskNum);
      const netIp = numToIp(netNum);
      const bcIp = numToIp(bcNum);
      
      let usableRange = "Ninguno";
      if (cidr < 31) {
        usableRange = `${numToIp(netNum + 1)} - ${numToIp(bcNum - 1)}`;
      } else if (cidr === 31) {
        usableRange = `${netIp} - ${bcIp}`;
      } else if (cidr === 32) {
        usableRange = `${netIp}`;
      }

      resultsDiv.innerHTML = `
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <span class="text-cyan">Dirección IP:</span>
            <br/>${ipStr}
          </div>
          <div>
            <span class="text-cyan">Máscara de Red:</span>
            <br/>${maskIp} <span class="text-ts">(/${cidr})</span>
          </div>
          <div>
            <span class="text-cyan">IP de Red:</span>
            <br/>${netIp}
          </div>
          <div>
            <span class="text-cyan">IP de Broadcast:</span>
            <br/>${bcIp}
          </div>
          <div class="sm:col-span-2">
            <span class="text-cyan">Rango Utilizable:</span>
            <br/>${usableRange}
          </div>
        </div>
      `;
    });
  </script>
</body>
</html>
