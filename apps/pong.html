<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Pong — Lab</title>
  <meta name="description" content="Minijuego clásico de Pong con estética Cyberpunk." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cyan: '#00fff0',
            magenta: '#ff00c8',
            accent: '#00ff87',
            'accent-dim': '#00cc6a',
            surface: '#080810',
            's1': '#0e0e18',
            's2': '#13131f',
            's3': '#1a1a28',
            's4': '#222235',
            border: '#2a2a40',
            'tp': '#eeeeff',
            'ts': '#7878a0',
            'tm': '#44445a',
          },
          fontFamily: {
            mono: ['"JetBrains Mono"', 'monospace'],
            sans: ['"Inter"', 'system-ui', 'sans-serif'],
          },
          animation: {
            'blink': 'blink 1.1s step-end infinite',
            'pulse-slow': 'pulse 3s ease-in-out infinite',
            'scan': 'scan 8s linear infinite',
            'glitch': 'glitch 4s infinite',
          },
          keyframes: {
            blink: { '0%,100%': { opacity: '1' }, '50%': { opacity: '0' } },
            scan: { '0%': { transform: 'translateY(-100%)' }, '100%': { transform: 'translateY(100vh)' } },
            glitch: {
              '0%,90%,100%': { clipPath: 'inset(0 0 100% 0)', transform: 'translate(0)' },
              '92%': { clipPath: 'inset(20% 0 50% 0)', transform: 'translate(-3px, 2px)', color: '#ff00c8' },
              '94%': { clipPath: 'inset(60% 0 10% 0)', transform: 'translate(3px, -2px)', color: '#00fff0' },
              '96%': { clipPath: 'inset(40% 0 30% 0)', transform: 'translate(-2px, 1px)', color: '#00ff87' },
              '98%': { clipPath: 'inset(0 0 70% 0)', transform: 'translate(2px, -1px)' },
            },
          },
        },
      },
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --green: #00ff87;
      --cyan: #00fff0;
      --magenta: #ff00c8;
      --bg: #080810;
    }
    html { scroll-behavior: smooth; }
    body {
      background-color: var(--bg);
      color: #eeeeff;
      font-family: 'Inter', system-ui, sans-serif;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: #0a0a12; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(var(--green), var(--cyan)); border-radius: 2px; }
    ::selection { background: rgba(0, 255, 240, 0.2); color: #fff; }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(to bottom, transparent 0px, transparent 2px, rgba(0, 0, 0, 0.06) 2px, rgba(0, 0, 0, 0.06) 3px);
      pointer-events: none;
      z-index: 9998;
    }
    .scan-line {
      position: fixed; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent 0%, var(--cyan) 40%, var(--green) 60%, transparent 100%);
      opacity: 0.06; animation: scan 12s linear infinite; pointer-events: none; z-index: 9997;
    }
    .cyber-grid {
      background-image: linear-gradient(rgba(0, 255, 240, 0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 240, 0.025) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    .glitch {
      position: relative; display: inline-block; color: var(--green);
      text-shadow: 0 0 30px rgba(0, 255, 135, 0.5), 0 0 60px rgba(0, 255, 135, 0.2);
    }
    .glitch::before, .glitch::after {
      content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    }
    .glitch::before { color: var(--magenta); animation: glitch-1 4s infinite; clip-path: inset(0 0 100% 0); }
    .glitch::after { color: var(--cyan); animation: glitch-2 4s infinite; clip-path: inset(0 0 100% 0); }
    @keyframes glitch-1 {
      0%, 89%, 100% { clip-path: inset(0 0 100% 0); transform: translate(0); }
      90% { clip-path: inset(15% 0 55% 0); transform: translate(-3px, 2px); }
      92% { clip-path: inset(65% 0 5% 0); transform: translate(3px, -1px); }
      94% { clip-path: inset(35% 0 35% 0); transform: translate(-2px, 3px); }
      96% { clip-path: inset(80% 0 2% 0); transform: translate(2px, -2px); }
    }
    @keyframes glitch-2 {
      0%, 91%, 100% { clip-path: inset(0 0 100% 0); transform: translate(0); }
      92% { clip-path: inset(50% 0 25% 0); transform: translate(3px, -2px); }
      94% { clip-path: inset(10% 0 70% 0); transform: translate(-3px, 2px); }
      96% { clip-path: inset(70% 0 8% 0); transform: translate(2px, -1px); }
      98% { clip-path: inset(25% 0 50% 0); transform: translate(-2px, 2px); }
    }
    .neon-green { color: var(--green); text-shadow: 0 0 8px rgba(0, 255, 135, 0.6), 0 0 20px rgba(0, 255, 135, 0.3); }
    .neon-cyan { color: var(--cyan); text-shadow: 0 0 8px rgba(0, 255, 240, 0.6), 0 0 20px rgba(0, 255, 240, 0.3); }
    
    .btn-outline {
      display: inline-flex; align-items: center; gap: 8px; padding: 10px 28px;
      background: transparent; color: var(--cyan); font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem; font-weight: 500; border-radius: 4px; border: 1px solid rgba(0, 255, 240, 0.4);
      cursor: pointer; transition: all 0.25s ease; text-decoration: none;
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    }
    .btn-outline:hover, .btn-outline.active {
      background: rgba(0, 255, 240, 0.08); border-color: var(--cyan);
      box-shadow: 0 0 20px rgba(0, 255, 240, 0.3); color: #fff; transform: translateY(-2px);
    }
    .btn-outline.active {
      background: rgba(0, 255, 240, 0.2);
    }
  </style>
</head>
<body class="cyber-grid">
  <div class="scan-line"></div>
  <header id="navbar" class="fixed top-0 inset-x-0 z-50 transition-all duration-300" style="background:rgba(8,8,16,0.82);backdrop-filter:blur(18px);border-bottom:1px solid rgba(0,255,240,0.07);">
    <nav class="max-w-6xl mx-auto px-5 sm:px-8 h-14 flex items-center justify-between">
      <a href="../index.html" class="font-mono font-bold tracking-widest flex items-center gap-1 text-sm text-cyan hover:text-green transition-colors">
        <span>&lt;- Volver al Lab</span>
      </a>
      <a href="https://enmanuel.tech" class="font-mono font-bold tracking-widest flex items-center gap-1 text-sm">
        <span style="color:#44445a">[</span><span class="neon-green">Cardoza</span><span style="color:#44445a">.</span><span class="neon-cyan">Dev</span><span class="animate-blink" style="color:#00ff87">_</span><span style="color:#44445a">]</span>
      </a>
    </nav>
  </header>

  <main class="pt-24 pb-12 max-w-4xl mx-auto px-5 flex flex-col items-center">
    <h1 class="font-mono font-bold leading-none mb-8 text-center" style="font-size:clamp(2rem,6vw,3.5rem);">
      <span class="glitch" data-text="Neon Pong">Neon Pong</span>
    </h1>
    
    <div class="flex gap-4 mb-6 z-10 relative">
      <button id="btn-1p" class="btn-outline active">1 Jugador (vs IA)</button>
      <button id="btn-2p" class="btn-outline">2 Jugadores (Local)</button>
    </div>

    <div class="relative z-10 flex justify-center w-full">
      <canvas id="pongCanvas" width="800" height="400" class="border border-cyan/30 rounded shadow-[0_0_20px_rgba(0,255,240,0.1)] bg-[#050508] max-w-full"></canvas>
    </div>
    
    <p class="font-mono text-ts text-sm mt-6 z-10 text-center relative">
      Jugador 1: W/S | Jugador 2: Flechas Arriba/Abajo
    </p>
  </main>

  <script>
    const canvas = document.getElementById('pongCanvas');
    const ctx = canvas.getContext('2d');
    
    const btn1p = document.getElementById('btn-1p');
    const btn2p = document.getElementById('btn-2p');
    
    // Config
    const paddleWidth = 10;
    const paddleHeight = 80;
    const ballSize = 8;
    const margin = 10;
    let mode = '1p'; // '1p' or '2p'
    
    // State
    const p1 = { x: margin, y: canvas.height/2 - paddleHeight/2, score: 0, dy: 0, speed: 6 };
    const p2 = { x: canvas.width - margin - paddleWidth, y: canvas.height/2 - paddleHeight/2, score: 0, dy: 0, speed: 6 };
    const ball = { x: canvas.width/2, y: canvas.height/2, dx: 4, dy: 4, speedMultiplier: 1 };
    
    // Controls
    const keys = { w: false, s: false, ArrowUp: false, ArrowDown: false };
    
    document.addEventListener('keydown', (e) => {
      if(e.key === 'w' || e.key === 'W') keys.w = true;
      if(e.key === 's' || e.key === 'S') keys.s = true;
      if(e.key === 'ArrowUp') { keys.ArrowUp = true; e.preventDefault(); }
      if(e.key === 'ArrowDown') { keys.ArrowDown = true; e.preventDefault(); }
    });
    
    document.addEventListener('keyup', (e) => {
      if(e.key === 'w' || e.key === 'W') keys.w = false;
      if(e.key === 's' || e.key === 'S') keys.s = false;
      if(e.key === 'ArrowUp') keys.ArrowUp = false;
      if(e.key === 'ArrowDown') keys.ArrowDown = false;
    });
    
    // Mode selection
    btn1p.addEventListener('click', () => { mode = '1p'; btn1p.classList.add('active'); btn2p.classList.remove('active'); resetGame(); p1.score = 0; p2.score = 0; });
    btn2p.addEventListener('click', () => { mode = '2p'; btn2p.classList.add('active'); btn1p.classList.remove('active'); resetGame(); p1.score = 0; p2.score = 0; });
    
    function resetBall() {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.speedMultiplier = 1;
      ball.dx = (Math.random() > 0.5 ? 4 : -4);
      ball.dy = (Math.random() > 0.5 ? 4 : -4);
    }

    function resetGame() {
      p1.y = canvas.height/2 - paddleHeight/2;
      p2.y = canvas.height/2 - paddleHeight/2;
      resetBall();
    }
    
    function drawRect(x, y, w, h, color, blurColor) {
      ctx.fillStyle = color;
      ctx.shadowBlur = 15;
      ctx.shadowColor = blurColor;
      ctx.fillRect(x, y, w, h);
      ctx.shadowBlur = 0;
    }
    
    function drawCircle(x, y, r, color, blurColor) {
      ctx.fillStyle = color;
      ctx.shadowBlur = 15;
      ctx.shadowColor = blurColor;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI*2, false);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    
    function drawText(text, x, y, color) {
      ctx.fillStyle = color;
      ctx.font = '30px "JetBrains Mono", monospace';
      ctx.shadowBlur = 10;
      ctx.shadowColor = color;
      ctx.fillText(text, x, y);
      ctx.shadowBlur = 0;
    }
    
    function drawNet() {
      ctx.strokeStyle = 'rgba(0, 255, 240, 0.2)';
      ctx.lineWidth = 2;
      ctx.setLineDash([10, 15]);
      ctx.beginPath();
      ctx.moveTo(canvas.width/2, 0);
      ctx.lineTo(canvas.width/2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    
    function update() {
      // P1 move
      if (keys.w && p1.y > 0) p1.y -= p1.speed;
      if (keys.s && p1.y < canvas.height - paddleHeight) p1.y += p1.speed;
      
      // P2 move
      if (mode === '2p') {
        if (keys.ArrowUp && p2.y > 0) p2.y -= p2.speed;
        if (keys.ArrowDown && p2.y < canvas.height - paddleHeight) p2.y += p2.speed;
      } else {
        // Simple AI
        const p2Center = p2.y + paddleHeight/2;
        if (p2Center < ball.y - 10 && p2.y < canvas.height - paddleHeight) {
          p2.y += p2.speed * 0.7; // slower than player
        } else if (p2Center > ball.y + 10 && p2.y > 0) {
          p2.y -= p2.speed * 0.7;
        }
      }
      
      // Ball move
      ball.x += ball.dx * ball.speedMultiplier;
      ball.y += ball.dy * ball.speedMultiplier;
      
      // Top/Bottom collision
      if (ball.y - ballSize < 0 || ball.y + ballSize > canvas.height) {
        ball.dy *= -1;
      }
      
      // Paddle collision
      const checkCollision = (p) => {
        return ball.x - ballSize < p.x + paddleWidth && 
               ball.x + ballSize > p.x && 
               ball.y + ballSize > p.y && 
               ball.y - ballSize < p.y + paddleHeight;
      };
      
      if (checkCollision(p1)) {
        ball.dx = Math.abs(ball.dx); // force go right
        ball.speedMultiplier *= 1.05;
        // Add some spin/angle based on where it hits the paddle
        let hitPos = (ball.y - (p1.y + paddleHeight/2)) / (paddleHeight/2);
        ball.dy = hitPos * 5; 
      }
      if (checkCollision(p2)) {
        ball.dx = -Math.abs(ball.dx); // force go left
        ball.speedMultiplier *= 1.05;
        let hitPos = (ball.y - (p2.y + paddleHeight/2)) / (paddleHeight/2);
        ball.dy = hitPos * 5;
      }
      
      // Scoring
      if (ball.x - ballSize < 0) {
        p2.score++;
        resetBall();
      } else if (ball.x + ballSize > canvas.width) {
        p1.score++;
        resetBall();
      }
    }
    
    function draw() {
      // Clear
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      drawNet();
      
      // Scores
      drawText(p1.score, canvas.width/4, 50, '#00ff87');
      drawText(p2.score, 3*canvas.width/4, 50, '#ff00c8');
      
      // Paddles
      drawRect(p1.x, p1.y, paddleWidth, paddleHeight, '#00ff87', 'rgba(0,255,135,0.6)');
      drawRect(p2.x, p2.y, paddleWidth, paddleHeight, '#ff00c8', 'rgba(255,0,200,0.6)');
      
      // Ball
      drawCircle(ball.x, ball.y, ballSize, '#00fff0', 'rgba(0,255,240,0.8)');
    }
    
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    
    resetGame();
    loop();
  </script>
</body>
</html>
