<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forensic Cipher Tool — Lab</title>
  <meta name="description" content="Herramienta de Criptografía Básica." />
  <link rel="icon" type="image/png" href="../favicon.png" />
  <link rel="shortcut icon" type="image/png" href="../favicon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cyan: '#00fff0',
            magenta: '#ff00c8',
            accent: '#00ff87',
            'accent-dim': '#00cc6a',
            surface: '#080810',
            's1': '#0e0e18',
            's2': '#13131f',
            's3': '#1a1a28',
            's4': '#222235',
            border: '#2a2a40',
            'tp': '#eeeeff',
            'ts': '#7878a0',
            'tm': '#44445a',
          },
          fontFamily: {
            mono: ['"JetBrains Mono"', 'monospace'],
            sans: ['"Inter"', 'system-ui', 'sans-serif'],
          },
          animation: {
            'blink': 'blink 1.1s step-end infinite',
            'pulse-slow': 'pulse 3s ease-in-out infinite',
            'scan': 'scan 8s linear infinite',
            'glitch': 'glitch 4s infinite',
          },
          keyframes: {
            blink: { '0%,100%': { opacity: '1' }, '50%': { opacity: '0' } },
            scan: { '0%': { transform: 'translateY(-100%)' }, '100%': { transform: 'translateY(100vh)' } },
            glitch: {
              '0%,90%,100%': { clipPath: 'inset(0 0 100% 0)', transform: 'translate(0)' },
              '92%': { clipPath: 'inset(20% 0 50% 0)', transform: 'translate(-3px, 2px)', color: '#ff00c8' },
              '94%': { clipPath: 'inset(60% 0 10% 0)', transform: 'translate(3px, -2px)', color: '#00fff0' },
              '96%': { clipPath: 'inset(40% 0 30% 0)', transform: 'translate(-2px, 1px)', color: '#00ff87' },
              '98%': { clipPath: 'inset(0 0 70% 0)', transform: 'translate(2px, -1px)' },
            },
          },
        },
      },
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --green: #00ff87;
      --cyan: #00fff0;
      --magenta: #ff00c8;
      --bg: #080810;
    }
    html { scroll-behavior: smooth; }
    body {
      background-color: var(--bg);
      color: #eeeeff;
      font-family: 'Inter', system-ui, sans-serif;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: #0a0a12; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(var(--green), var(--cyan)); border-radius: 2px; }
    ::selection { background: rgba(0, 255, 240, 0.2); color: #fff; }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(to bottom, transparent 0px, transparent 2px, rgba(0, 0, 0, 0.06) 2px, rgba(0, 0, 0, 0.06) 3px);
      pointer-events: none;
      z-index: 9998;
    }
    .scan-line {
      position: fixed; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent 0%, var(--cyan) 40%, var(--green) 60%, transparent 100%);
      opacity: 0.06; animation: scan 12s linear infinite; pointer-events: none; z-index: 9997;
    }
    .cyber-grid {
      background-image: linear-gradient(rgba(0, 255, 240, 0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 240, 0.025) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    .glitch {
      position: relative; display: inline-block; color: var(--green);
      text-shadow: 0 0 30px rgba(0, 255, 135, 0.5), 0 0 60px rgba(0, 255, 135, 0.2);
    }
    .glitch::before, .glitch::after {
      content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    }
    .glitch::before { color: var(--magenta); animation: glitch-1 4s infinite; clip-path: inset(0 0 100% 0); }
    .glitch::after { color: var(--cyan); animation: glitch-2 4s infinite; clip-path: inset(0 0 100% 0); }
    @keyframes glitch-1 {
      0%, 89%, 100% { clip-path: inset(0 0 100% 0); transform: translate(0); }
      90% { clip-path: inset(15% 0 55% 0); transform: translate(-3px, 2px); }
      92% { clip-path: inset(65% 0 5% 0); transform: translate(3px, -1px); }
      94% { clip-path: inset(35% 0 35% 0); transform: translate(-2px, 3px); }
      96% { clip-path: inset(80% 0 2% 0); transform: translate(2px, -2px); }
    }
    @keyframes glitch-2 {
      0%, 91%, 100% { clip-path: inset(0 0 100% 0); transform: translate(0); }
      92% { clip-path: inset(50% 0 25% 0); transform: translate(3px, -2px); }
      94% { clip-path: inset(10% 0 70% 0); transform: translate(-3px, 2px); }
      96% { clip-path: inset(70% 0 8% 0); transform: translate(2px, -1px); }
      98% { clip-path: inset(25% 0 50% 0); transform: translate(-2px, 2px); }
    }
    .neon-green { color: var(--green); text-shadow: 0 0 8px rgba(0, 255, 135, 0.6), 0 0 20px rgba(0, 255, 135, 0.3); }
    .neon-cyan { color: var(--cyan); text-shadow: 0 0 8px rgba(0, 255, 240, 0.6), 0 0 20px rgba(0, 255, 240, 0.3); }
    
    .btn-outline {
      display: inline-flex; align-items: center; gap: 8px; padding: 10px 28px;
      background: transparent; color: var(--magenta); font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem; font-weight: 500; border-radius: 4px; border: 1px solid rgba(255, 0, 200, 0.4);
      cursor: pointer; transition: all 0.25s ease; text-decoration: none;
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    }
    .btn-outline:hover {
      background: rgba(255, 0, 200, 0.08); border-color: var(--magenta);
      box-shadow: 0 0 20px rgba(255, 0, 200, 0.3); color: #ff66e0; transform: translateY(-2px);
    }
  </style>
</head>
<body class="cyber-grid">
  <div class="scan-line"></div>
  <header id="navbar" class="fixed top-0 inset-x-0 z-50 transition-all duration-300" style="background:rgba(8,8,16,0.82);backdrop-filter:blur(18px);border-bottom:1px solid rgba(0,255,240,0.07);">
    <nav class="max-w-6xl mx-auto px-5 sm:px-8 h-14 flex items-center justify-between">
      <a href="../index.html" class="font-mono font-bold tracking-widest flex items-center gap-1 text-sm text-cyan hover:text-green transition-colors">
        <span>&lt;- Volver al Lab</span>
      </a>
      <a href="https://enmanuel.tech" class="font-mono font-bold tracking-widest flex items-center gap-1 text-sm">
        <span style="color:#44445a">[</span><span class="neon-green">Cardoza</span><span style="color:#44445a">.</span><span class="neon-cyan">Dev</span><span class="animate-blink" style="color:#00ff87">_</span><span style="color:#44445a">]</span>
      </a>
    </nav>
  </header>

  <main class="pt-24 pb-12 max-w-5xl mx-auto px-5">
    <h1 class="font-mono font-bold leading-none mb-8 text-center" style="font-size:clamp(2rem,6vw,3.5rem);">
      <span class="glitch" data-text="Forensic Cipher Tool">Forensic Cipher Tool</span>
    </h1>
    
    <div class="bg-[#0e0e1a] border border-[#2a2a40] rounded-lg p-6 shadow-[0_0_20px_rgba(255,0,200,0.05)] relative z-10">
      
      <div class="flex flex-wrap justify-center gap-6 mb-8 mt-2">
        <label class="flex items-center gap-2 text-sm font-mono text-ts cursor-pointer hover:text-[#eeeeff] transition-colors">
          <input type="radio" name="algorithm" value="b64-encode" class="accent-magenta" checked> Base64 Encode
        </label>
        <label class="flex items-center gap-2 text-sm font-mono text-ts cursor-pointer hover:text-[#eeeeff] transition-colors">
          <input type="radio" name="algorithm" value="b64-decode" class="accent-magenta"> Base64 Decode
        </label>
        <label class="flex items-center gap-2 text-sm font-mono text-ts cursor-pointer hover:text-[#eeeeff] transition-colors">
          <input type="radio" name="algorithm" value="rot13" class="accent-magenta"> ROT13
        </label>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="flex flex-col h-full">
          <label class="block font-mono text-cyan text-xs uppercase mb-2">Texto de Entrada</label>
          <textarea id="input-text" rows="10" placeholder="Introduce el texto aquí..." class="w-full h-full bg-[#050508] border border-cyan/30 text-[#eeeeff] font-mono p-4 rounded-md focus:border-cyan focus:shadow-[0_0_10px_rgba(0,255,240,0.3)] outline-none transition-all resize-none"></textarea>
        </div>
        
        <div class="flex flex-col h-full">
          <label class="block font-mono text-magenta text-xs uppercase mb-2">Texto de Salida</label>
          <textarea id="output-text" rows="10" readonly placeholder="El resultado aparecerá aquí..." class="w-full h-full bg-[#050508] border border-magenta/30 text-magenta font-mono p-4 rounded-md focus:border-magenta focus:shadow-[0_0_10px_rgba(255,0,200,0.3)] outline-none transition-all resize-none"></textarea>
        </div>
      </div>
      
      <div class="mt-8 flex justify-center">
        <button id="process-btn" class="btn-outline" style="border-color:var(--magenta); color:var(--magenta);">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" class="mr-2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          Procesar
        </button>
      </div>
    </div>
  </main>

  <script>
    function rot13(str) {
      return str.replace(/[a-zA-Z]/g, function(c){
        return String.fromCharCode((c <= "Z" ? 90 : 122) >= (c = c.charCodeAt(0) + 13) ? c : c - 26);
      });
    }

    document.getElementById('process-btn').addEventListener('click', () => {
      const input = document.getElementById('input-text').value;
      const outputArea = document.getElementById('output-text');
      const algo = document.querySelector('input[name="algorithm"]:checked').value;

      if (!input) {
        outputArea.value = '';
        return;
      }

      try {
        let result = '';
        if (algo === 'b64-encode') {
          result = btoa(unescape(encodeURIComponent(input)));
        } else if (algo === 'b64-decode') {
          result = decodeURIComponent(escape(atob(input)));
        } else if (algo === 'rot13') {
          result = rot13(input);
        }
        outputArea.value = result;
      } catch (e) {
        outputArea.value = 'Error: Entrada inválida para la decodificación.';
      }
    });
  </script>
</body>
</html>
