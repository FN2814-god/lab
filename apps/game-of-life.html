<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game of Life — Lab</title>
  <meta name="description" content="Simulador de Autómata Celular de Conway con estética Neon Cyberpunk." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cyan: '#00fff0',
            magenta: '#ff00c8',
            accent: '#00ff87',
            'accent-dim': '#00cc6a',
            surface: '#080810',
            's1': '#0e0e18',
            's2': '#13131f',
            's3': '#1a1a28',
            's4': '#222235',
            border: '#2a2a40',
            'tp': '#eeeeff',
            'ts': '#7878a0',
            'tm': '#44445a',
          },
          fontFamily: {
            mono: ['"JetBrains Mono"', 'monospace'],
            sans: ['"Inter"', 'system-ui', 'sans-serif'],
          },
          animation: {
            'blink': 'blink 1.1s step-end infinite',
            'pulse-slow': 'pulse 3s ease-in-out infinite',
            'scan': 'scan 8s linear infinite',
            'glitch': 'glitch 4s infinite',
          },
          keyframes: {
            blink: { '0%,100%': { opacity: '1' }, '50%': { opacity: '0' } },
            scan: { '0%': { transform: 'translateY(-100%)' }, '100%': { transform: 'translateY(100vh)' } },
            glitch: {
              '0%,90%,100%': { clipPath: 'inset(0 0 100% 0)', transform: 'translate(0)' },
              '92%': { clipPath: 'inset(20% 0 50% 0)', transform: 'translate(-3px, 2px)', color: '#ff00c8' },
              '94%': { clipPath: 'inset(60% 0 10% 0)', transform: 'translate(3px, -2px)', color: '#00fff0' },
              '96%': { clipPath: 'inset(40% 0 30% 0)', transform: 'translate(-2px, 1px)', color: '#00ff87' },
              '98%': { clipPath: 'inset(0 0 70% 0)', transform: 'translate(2px, -1px)' },
            },
          },
        },
      },
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --green: #00ff87;
      --cyan: #00fff0;
      --magenta: #ff00c8;
      --bg: #080810;
    }
    html { scroll-behavior: smooth; }
    body {
      background-color: var(--bg);
      color: #eeeeff;
      font-family: 'Inter', system-ui, sans-serif;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: #0a0a12; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(var(--green), var(--cyan)); border-radius: 2px; }
    ::selection { background: rgba(0, 255, 240, 0.2); color: #fff; }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(to bottom, transparent 0px, transparent 2px, rgba(0, 0, 0, 0.06) 2px, rgba(0, 0, 0, 0.06) 3px);
      pointer-events: none;
      z-index: 9998;
    }
    .scan-line {
      position: fixed; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent 0%, var(--cyan) 40%, var(--green) 60%, transparent 100%);
      opacity: 0.06; animation: scan 12s linear infinite; pointer-events: none; z-index: 9997;
    }
    .cyber-grid {
      background-image: linear-gradient(rgba(0, 255, 240, 0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 240, 0.025) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    .glitch {
      position: relative; display: inline-block; color: var(--green);
      text-shadow: 0 0 30px rgba(0, 255, 135, 0.5), 0 0 60px rgba(0, 255, 135, 0.2);
    }
    .glitch::before, .glitch::after {
      content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    }
    .glitch::before { color: var(--magenta); animation: glitch-1 4s infinite; clip-path: inset(0 0 100% 0); }
    .glitch::after { color: var(--cyan); animation: glitch-2 4s infinite; clip-path: inset(0 0 100% 0); }
    @keyframes glitch-1 {
      0%, 89%, 100% { clip-path: inset(0 0 100% 0); transform: translate(0); }
      90% { clip-path: inset(15% 0 55% 0); transform: translate(-3px, 2px); }
      92% { clip-path: inset(65% 0 5% 0); transform: translate(3px, -1px); }
      94% { clip-path: inset(35% 0 35% 0); transform: translate(-2px, 3px); }
      96% { clip-path: inset(80% 0 2% 0); transform: translate(2px, -2px); }
    }
    @keyframes glitch-2 {
      0%, 91%, 100% { clip-path: inset(0 0 100% 0); transform: translate(0); }
      92% { clip-path: inset(50% 0 25% 0); transform: translate(3px, -2px); }
      94% { clip-path: inset(10% 0 70% 0); transform: translate(-3px, 2px); }
      96% { clip-path: inset(70% 0 8% 0); transform: translate(2px, -1px); }
      98% { clip-path: inset(25% 0 50% 0); transform: translate(-2px, 2px); }
    }
    .neon-green { color: var(--green); text-shadow: 0 0 8px rgba(0, 255, 135, 0.6), 0 0 20px rgba(0, 255, 135, 0.3); }
    .neon-cyan { color: var(--cyan); text-shadow: 0 0 8px rgba(0, 255, 240, 0.6), 0 0 20px rgba(0, 255, 240, 0.3); }
    .neon-mag { color: var(--magenta); text-shadow: 0 0 8px rgba(255, 0, 200, 0.6); }

    .btn-primary {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 18px;
      background: linear-gradient(135deg, var(--green) 0%, var(--cyan) 100%); color: #000;
      font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; font-weight: 700; border-radius: 4px;
      border: none; cursor: pointer; transition: all 0.25s ease; text-decoration: none;
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
    }
    .btn-primary:hover { box-shadow: 0 0 20px rgba(0, 255, 135, 0.5); transform: translateY(-1px); filter: brightness(1.1); }

    .btn-outline {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 16px;
      background: transparent; color: var(--cyan); font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem; font-weight: 500; border-radius: 4px; border: 1px solid rgba(0, 255, 240, 0.3);
      cursor: pointer; transition: all 0.25s ease; text-decoration: none;
      clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    }
    .btn-outline:hover, .btn-outline.active {
      background: rgba(0, 255, 240, 0.12); border-color: var(--cyan);
      box-shadow: 0 0 16px rgba(0, 255, 240, 0.3); color: #fff; transform: translateY(-1px);
    }
    .btn-outline-mag {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 16px;
      background: transparent; color: var(--magenta); font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem; font-weight: 500; border-radius: 4px; border: 1px solid rgba(255, 0, 200, 0.3);
      cursor: pointer; transition: all 0.25s ease; text-decoration: none;
      clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    }
    .btn-outline-mag:hover {
      background: rgba(255, 0, 200, 0.12); border-color: var(--magenta);
      box-shadow: 0 0 16px rgba(255, 0, 200, 0.3); color: #fff; transform: translateY(-1px);
    }
    .stat-badge {
      font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;
      background: rgba(14, 14, 26, 0.85); border: 1px solid #1e1e32;
      padding: 4px 10px; border-radius: 4px; display: inline-flex; gap: 6px; align-items: center;
    }
  </style>
</head>
<body class="cyber-grid">
  <div class="scan-line"></div>
  <header id="navbar" class="fixed top-0 inset-x-0 z-50 transition-all duration-300" style="background:rgba(8,8,16,0.82);backdrop-filter:blur(18px);border-bottom:1px solid rgba(0,255,240,0.07);">
    <nav class="max-w-6xl mx-auto px-5 sm:px-8 h-14 flex items-center justify-between">
      <a href="../index.html" class="font-mono font-bold tracking-widest flex items-center gap-1 text-sm text-cyan hover:text-green transition-colors">
        <span>&lt;- Volver al Lab</span>
      </a>
      <a href="https://enmanuel.tech" class="font-mono font-bold tracking-widest flex items-center gap-1 text-sm">
        <span style="color:#44445a">[</span><span class="neon-green">Cardoza</span><span style="color:#44445a">.</span><span class="neon-cyan">Dev</span><span class="animate-blink" style="color:#00ff87">_</span><span style="color:#44445a">]</span>
      </a>
    </nav>
  </header>

  <main class="pt-20 pb-12 max-w-5xl mx-auto px-4 flex flex-col items-center">
    <div class="text-center mb-5">
      <h1 class="font-mono font-bold leading-none mb-2" style="font-size:clamp(1.8rem,5vw,3rem);">
        <span class="glitch" data-text="Conway's Game of Life">Conway's Game of Life</span>
      </h1>
      <p class="text-ts font-mono text-xs sm:text-sm">
        Simulador de autómata celular neón. Dibuja con el mouse o carga patrones autónomos.
      </p>
    </div>

    <!-- Telemetry Stats -->
    <div class="flex flex-wrap gap-2 sm:gap-4 mb-4 justify-center">
      <div class="stat-badge"><span class="text-ts">GEN:</span><span id="statGen" class="text-accent font-bold">0</span></div>
      <div class="stat-badge"><span class="text-ts">VIVAS:</span><span id="statAlive" class="text-cyan font-bold">0</span></div>
      <div class="stat-badge"><span class="text-ts">ESTADO:</span><span id="statStatus" class="text-magenta font-bold">PAUSA</span></div>
      <div class="stat-badge"><span class="text-ts">FPS:</span><span id="statFps" class="text-tp font-bold">25</span></div>
    </div>

    <!-- Controls Panel -->
    <div class="w-full bg-[#0e0e1a]/90 border border-[#1e1e32] rounded-lg p-3 sm:p-4 mb-4 flex flex-wrap gap-2.5 items-center justify-between shadow-lg">
      <div class="flex flex-wrap gap-2 items-center">
        <button id="btnPlay" class="btn-primary">
          <svg id="playIcon" width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <span id="playLabel">Iniciar</span>
        </button>
        <button id="btnStep" class="btn-outline">Paso (+1)</button>
        <button id="btnRandom" class="btn-outline">Caos</button>
        <button id="btnClear" class="btn-outline-mag">Limpiar</button>
      </div>

      <div class="flex flex-wrap gap-3 items-center text-xs font-mono">
        <div class="flex items-center gap-2">
          <label for="presetSelect" class="text-ts">Patrón:</label>
          <select id="presetSelect" class="bg-[#13131f] text-tp border border-[#2a2a40] rounded px-2 py-1.5 focus:border-cyan outline-none">
            <option value="none">-- Seleccionar --</option>
            <option value="gliderGun">Gosper Glider Gun</option>
            <option value="pulsar">Pulsar (Oscilador 3)</option>
            <option value="pentadecathlon">Pentadecathlon</option>
            <option value="acorn">Acorn (Crecimiento Infinito)</option>
            <option value="gliders">Flota de Gliders</option>
          </select>
        </div>

        <div class="flex items-center gap-2">
          <label for="speedRange" class="text-ts">Vel:</label>
          <input id="speedRange" type="range" min="2" max="60" value="25" class="w-20 accent-cyan cursor-pointer" />
        </div>

        <div class="flex items-center gap-2">
          <label for="paletteSelect" class="text-ts">Paleta:</label>
          <select id="paletteSelect" class="bg-[#13131f] text-tp border border-[#2a2a40] rounded px-2 py-1.5 focus:border-accent outline-none">
            <option value="cyber">Cyan / Magenta</option>
            <option value="matrix">Matrix Green</option>
            <option value="plasma">Plasma Solar</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Canvas Container -->
    <div class="relative w-full flex justify-center overflow-hidden border border-cyan/30 rounded-lg shadow-[0_0_25px_rgba(0,255,240,0.12)] bg-[#050508]">
      <canvas id="lifeCanvas" class="cursor-crosshair block w-full"></canvas>
    </div>

    <p class="font-mono text-ts text-xs mt-4 text-center">
      Tip: Haz clic o arrastra sobre el tablero para encender/apagar células de energía. Presiona <kbd class="px-1.5 py-0.5 bg-[#1a1a28] rounded border border-border text-cyan">Espacio</kbd> para pausar/reanudar.
    </p>
  </main>

  <script>
    const canvas = document.getElementById('lifeCanvas');
    const ctx = canvas.getContext('2d');

    const btnPlay = document.getElementById('btnPlay');
    const playIcon = document.getElementById('playIcon');
    const playLabel = document.getElementById('playLabel');
    const btnStep = document.getElementById('btnStep');
    const btnRandom = document.getElementById('btnRandom');
    const btnClear = document.getElementById('btnClear');
    const presetSelect = document.getElementById('presetSelect');
    const speedRange = document.getElementById('speedRange');
    const paletteSelect = document.getElementById('paletteSelect');

    const statGen = document.getElementById('statGen');
    const statAlive = document.getElementById('statAlive');
    const statStatus = document.getElementById('statStatus');
    const statFps = document.getElementById('statFps');

    // Simulation Config
    const CELL_SIZE = 10;
    let cols = 0;
    let rows = 0;
    let grid = [];
    let isRunning = false;
    let generation = 0;
    let targetFps = parseInt(speedRange.value, 10);
    let lastFrameTime = 0;
    let animId = null;
    let isDrawing = false;
    let drawMode = 1; // 1 = activate, 0 = kill

    const PALETTES = {
      cyber: { live: '#00fff0', glow: 'rgba(0, 255, 240, 0.6)', deadTrail: 'rgba(255, 0, 200, 0.15)' },
      matrix: { live: '#00ff87', glow: 'rgba(0, 255, 135, 0.7)', deadTrail: 'rgba(0, 255, 135, 0.12)' },
      plasma: { live: '#ff00c8', glow: 'rgba(255, 0, 200, 0.8)', deadTrail: 'rgba(255, 170, 0, 0.15)' }
    };
    let currentPalette = PALETTES.cyber;

    function resizeGrid() {
      const containerWidth = canvas.parentElement.clientWidth;
      const width = Math.min(containerWidth, 960);
      const height = Math.max(380, Math.floor(window.innerHeight * 0.52));
      
      canvas.width = width;
      canvas.height = height;

      cols = Math.floor(width / CELL_SIZE);
      rows = Math.floor(height / CELL_SIZE);

      const oldGrid = grid;
      grid = createEmptyGrid();
      
      // Preserve old state if possible
      if (oldGrid && oldGrid.length > 0) {
        for (let r = 0; r < Math.min(rows, oldGrid.length); r++) {
          for (let c = 0; c < Math.min(cols, oldGrid[0].length); c++) {
            grid[r][c] = oldGrid[r][c];
          }
        }
      }
      render();
    }

    function createEmptyGrid() {
      return Array.from({ length: rows }, () => new Uint8Array(cols));
    }

    function randomizeGrid(density = 0.18) {
      grid = createEmptyGrid();
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          grid[r][c] = Math.random() < density ? 1 : 0;
        }
      }
      generation = 0;
      render();
      updateStats();
    }

    function countNeighbors(r, c) {
      let count = 0;
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const nr = (r + dr + rows) % rows;
          const nc = (c + dc + cols) % cols;
          count += grid[nr][nc];
        }
      }
      return count;
    }

    function step() {
      const next = createEmptyGrid();
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const neighbors = countNeighbors(r, c);
          const alive = grid[r][c];
          if (alive && (neighbors === 2 || neighbors === 3)) {
            next[r][c] = 1;
          } else if (!alive && neighbors === 3) {
            next[r][c] = 1;
          }
        }
      }
      grid = next;
      generation++;
      updateStats();
      render();
    }

    function render() {
      ctx.fillStyle = '#050508';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Subtle grid lines
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 0.5;
      for (let x = 0; x <= cols * CELL_SIZE; x += CELL_SIZE) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, rows * CELL_SIZE);
        ctx.stroke();
      }
      for (let y = 0; y <= rows * CELL_SIZE; y += CELL_SIZE) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(cols * CELL_SIZE, y);
        ctx.stroke();
      }

      // Draw alive cells with glow
      ctx.shadowBlur = 8;
      ctx.shadowColor = currentPalette.glow;
      ctx.fillStyle = currentPalette.live;

      const offset = 1;
      const size = CELL_SIZE - offset * 2;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (grid[r][c] === 1) {
            ctx.fillRect(c * CELL_SIZE + offset, r * CELL_SIZE + offset, size, size);
          }
        }
      }
      ctx.shadowBlur = 0;
    }

    function countAlive() {
      let total = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          total += grid[r][c];
        }
      }
      return total;
    }

    function updateStats() {
      statGen.textContent = generation.toLocaleString();
      statAlive.textContent = countAlive().toLocaleString();
      statStatus.textContent = isRunning ? 'ACTIVO' : 'PAUSA';
      statStatus.className = isRunning ? 'text-accent font-bold' : 'text-magenta font-bold';
      statFps.textContent = targetFps;
    }

    function loop(timestamp) {
      if (!isRunning) return;
      const interval = 1000 / targetFps;
      if (timestamp - lastFrameTime >= interval) {
        lastFrameTime = timestamp;
        step();
      }
      animId = requestAnimationFrame(loop);
    }

    function togglePlay() {
      isRunning = !isRunning;
      if (isRunning) {
        playLabel.textContent = 'Pausar';
        playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
        btnPlay.classList.add('filter', 'brightness-125');
        lastFrameTime = performance.now();
        animId = requestAnimationFrame(loop);
      } else {
        playLabel.textContent = 'Iniciar';
        playIcon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
        btnPlay.classList.remove('filter', 'brightness-125');
        if (animId) cancelAnimationFrame(animId);
      }
      updateStats();
    }

    // Pattern definitions
    const PRESETS = {
      gliderGun: [
        [24,0],[22,1],[24,1],[12,2],[13,2],[20,2],[21,2],[34,2],[35,2],[11,3],[15,3],[20,3],[21,3],[34,3],[35,3],
        [0,4],[1,4],[10,4],[16,4],[20,4],[21,4],[0,5],[1,5],[10,5],[14,5],[16,5],[17,5],[22,5],[24,5],
        [10,6],[16,6],[24,6],[11,7],[15,7],[12,8],[13,8]
      ],
      pulsar: [
        [-6,-4],[-6,-3],[-6,-2],[-4,-6],[-3,-6],[-2,-6],[-1,-4],[-1,-3],[-1,-2],[-4,-1],[-3,-1],[-2,-1],
        [6,-4],[6,-3],[6,-2],[4,-6],[3,-6],[2,-6],[1,-4],[1,-3],[1,-2],[4,-1],[3,-1],[2,-1],
        [-6,4],[-6,3],[-6,2],[-4,6],[-3,6],[-2,6],[-1,4],[-1,3],[-1,2],[-4,1],[-3,1],[-2,1],
        [6,4],[6,3],[6,2],[4,6],[3,6],[2,6],[1,4],[1,3],[1,2],[4,1],[3,1],[2,1]
      ],
      pentadecathlon: [
        [0,-4],[0,-3],[1,-2],[-1,-2],[0,-1],[0,0],[0,1],[0,2],[1,3],[-1,3],[0,4],[0,5]
      ],
      acorn: [
        [1,0],[3,1],[0,2],[1,2],[4,2],[5,2],[6,2]
      ],
      gliders: [
        [2,1],[3,2],[1,3],[2,3],[3,3],
        [12,1],[13,2],[11,3],[12,3],[13,3],
        [22,1],[23,2],[21,3],[22,3],[23,3]
      ]
    };

    function loadPreset(name) {
      if (!PRESETS[name]) return;
      grid = createEmptyGrid();
      const coords = PRESETS[name];
      const midR = Math.floor(rows / 2);
      const midC = Math.floor(cols / 2);

      coords.forEach(([dx, dy]) => {
        const r = (midR + dy + rows) % rows;
        const c = (midC + dx + cols) % cols;
        grid[r][c] = 1;
      });

      generation = 0;
      render();
      updateStats();
    }

    // Event Listeners
    btnPlay.addEventListener('click', togglePlay);
    btnStep.addEventListener('click', () => {
      if (isRunning) togglePlay();
      step();
    });
    btnRandom.addEventListener('click', () => randomizeGrid(0.2));
    btnClear.addEventListener('click', () => {
      if (isRunning) togglePlay();
      grid = createEmptyGrid();
      generation = 0;
      presetSelect.value = 'none';
      render();
      updateStats();
    });

    presetSelect.addEventListener('change', (e) => {
      if (e.target.value !== 'none') {
        if (isRunning) togglePlay();
        loadPreset(e.target.value);
      }
    });

    speedRange.addEventListener('input', (e) => {
      targetFps = parseInt(e.target.value, 10);
      updateStats();
    });

    paletteSelect.addEventListener('change', (e) => {
      currentPalette = PALETTES[e.target.value] || PALETTES.cyber;
      render();
    });

    // Drawing on canvas
    function getCellCoordinates(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = (e.clientX - rect.left) * scaleX;
      const y = (e.clientY - rect.top) * scaleY;
      const c = Math.floor(x / CELL_SIZE);
      const r = Math.floor(y / CELL_SIZE);
      return { r, c };
    }

    function applyDraw(e) {
      const { r, c } = getCellCoordinates(e);
      if (r >= 0 && r < rows && c >= 0 && c < cols) {
        grid[r][c] = drawMode;
        render();
        updateStats();
      }
    }

    canvas.addEventListener('mousedown', (e) => {
      isDrawing = true;
      const { r, c } = getCellCoordinates(e);
      if (r >= 0 && r < rows && c >= 0 && c < cols) {
        drawMode = grid[r][c] ? 0 : 1;
        grid[r][c] = drawMode;
        render();
        updateStats();
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      if (isDrawing) applyDraw(e);
    });

    window.addEventListener('mouseup', () => { isDrawing = false; });

    // Touch support for mobile
    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        e.preventDefault();
        isDrawing = true;
        const touch = e.touches[0];
        const { r, c } = getCellCoordinates(touch);
        if (r >= 0 && r < rows && c >= 0 && c < cols) {
          drawMode = grid[r][c] ? 0 : 1;
          grid[r][c] = drawMode;
          render();
          updateStats();
        }
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      if (isDrawing && e.touches.length === 1) {
        e.preventDefault();
        applyDraw(e.touches[0]);
      }
    }, { passive: false });

    window.addEventListener('touchend', () => { isDrawing = false; });

    // Spacebar to pause/resume
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && e.target === document.body) {
        e.preventDefault();
        togglePlay();
      }
    });

    window.addEventListener('resize', () => {
      const oldCols = cols;
      const oldRows = rows;
      resizeGrid();
      if (oldCols === 0 && oldRows === 0) {
        loadPreset('gliderGun');
      }
    });

    // Init
    resizeGrid();
    loadPreset('gliderGun');
  </script>
</body>
</html>
