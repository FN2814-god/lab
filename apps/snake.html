<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Snake — Lab</title>
  <meta name="description" content="Juego clásico de Snake reimaginado con estética Cyberpunk y efectos neón." />
  <link rel="icon" type="image/png" href="../favicon.png" />
  <link rel="shortcut icon" type="image/png" href="../favicon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cyan: '#00fff0',
            magenta: '#ff00c8',
            accent: '#00ff87',
            'accent-dim': '#00cc6a',
            surface: '#080810',
            's1': '#0e0e18',
            's2': '#13131f',
            's3': '#1a1a28',
            's4': '#222235',
            border: '#2a2a40',
            'tp': '#eeeeff',
            'ts': '#7878a0',
            'tm': '#44445a',
          },
          fontFamily: {
            mono: ['"JetBrains Mono"', 'monospace'],
            sans: ['"Inter"', 'system-ui', 'sans-serif'],
          },
          animation: {
            'blink': 'blink 1.1s step-end infinite',
            'pulse-slow': 'pulse 3s ease-in-out infinite',
            'scan': 'scan 8s linear infinite',
            'glitch': 'glitch 4s infinite',
          },
        },
      },
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --green: #00ff87;
      --cyan: #00fff0;
      --magenta: #ff00c8;
      --bg: #080810;
    }
    html { scroll-behavior: smooth; }
    body {
      background-color: var(--bg);
      color: #eeeeff;
      font-family: 'Inter', system-ui, sans-serif;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #0a0a12; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(var(--green), var(--cyan)); border-radius: 2px; }
    ::selection { background: rgba(0, 255, 240, 0.2); color: #fff; }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(to bottom, transparent 0px, transparent 2px, rgba(0, 0, 0, 0.06) 2px, rgba(0, 0, 0, 0.06) 3px);
      pointer-events: none;
      z-index: 9998;
    }
    .scan-line {
      position: fixed; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent 0%, var(--cyan) 40%, var(--green) 60%, transparent 100%);
      opacity: 0.06; animation: scan 12s linear infinite; pointer-events: none; z-index: 9997;
    }
    .cyber-grid {
      background-image: linear-gradient(rgba(0, 255, 240, 0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 240, 0.025) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    .glitch {
      position: relative; display: inline-block; color: var(--green);
      text-shadow: 0 0 30px rgba(0, 255, 135, 0.5), 0 0 60px rgba(0, 255, 135, 0.2);
    }
    .glitch::before, .glitch::after {
      content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    }
    .glitch::before { color: var(--magenta); animation: glitch-1 4s infinite; clip-path: inset(0 0 100% 0); }
    .glitch::after { color: var(--cyan); animation: glitch-2 4s infinite; clip-path: inset(0 0 100% 0); }
    @keyframes glitch-1 {
      0%, 89%, 100% { clip-path: inset(0 0 100% 0); transform: translate(0); }
      90% { clip-path: inset(15% 0 55% 0); transform: translate(-3px, 2px); }
      92% { clip-path: inset(65% 0 5% 0); transform: translate(3px, -1px); }
      94% { clip-path: inset(35% 0 35% 0); transform: translate(-2px, 3px); }
      96% { clip-path: inset(80% 0 2% 0); transform: translate(2px, -2px); }
    }
    @keyframes glitch-2 {
      0%, 91%, 100% { clip-path: inset(0 0 100% 0); transform: translate(0); }
      92% { clip-path: inset(50% 0 25% 0); transform: translate(3px, -2px); }
      94% { clip-path: inset(10% 0 70% 0); transform: translate(-3px, 2px); }
      96% { clip-path: inset(70% 0 8% 0); transform: translate(2px, -1px); }
      98% { clip-path: inset(25% 0 50% 0); transform: translate(-2px, 2px); }
    }
    .neon-green { color: var(--green); text-shadow: 0 0 8px rgba(0, 255, 135, 0.6); }
    .neon-cyan { color: var(--cyan); text-shadow: 0 0 8px rgba(0, 255, 240, 0.6); }
    .neon-mag { color: var(--magenta); text-shadow: 0 0 8px rgba(255, 0, 200, 0.6); }

    .dpad-btn {
      width: 54px; height: 54px; border-radius: 8px;
      background: #0e0e1a; border: 1px solid #2a2a40; color: var(--cyan);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; cursor: pointer; user-select: none; transition: all 0.1s ease;
    }
    .dpad-btn:active {
      background: rgba(0, 255, 240, 0.2); border-color: var(--cyan);
      box-shadow: 0 0 15px rgba(0, 255, 240, 0.5); transform: scale(0.95);
    }
  </style>
</head>
<body class="cyber-grid min-h-screen flex flex-col">
  <div class="scan-line"></div>
  <header id="navbar" class="fixed top-0 inset-x-0 z-50 transition-all duration-300" style="background:rgba(8,8,16,0.82);backdrop-filter:blur(18px);border-bottom:1px solid rgba(0,255,240,0.07);">
    <nav class="max-w-6xl mx-auto px-5 sm:px-8 h-14 flex items-center justify-between">
      <a href="../index.html" class="font-mono font-bold tracking-widest flex items-center gap-1 text-sm text-cyan hover:text-green transition-colors">
        <span>&lt;- Volver al Lab</span>
      </a>
      <a href="https://enmanuel.tech" class="font-mono font-bold tracking-widest flex items-center gap-1 text-sm">
        <span style="color:#44445a">[</span><span class="neon-green">Cardoza</span><span style="color:#44445a">.</span><span class="neon-cyan">Dev</span><span class="animate-blink" style="color:#00ff87">_</span><span style="color:#44445a">]</span>
      </a>
    </nav>
  </header>

  <main class="pt-20 pb-10 max-w-4xl w-full mx-auto px-4 flex flex-col items-center">
    <div class="text-center mb-4">
      <h1 class="font-mono font-bold leading-none mb-2" style="font-size:clamp(1.8rem,5vw,3rem);">
        <span class="glitch" data-text="Neon Cyber Snake">Neon Cyber Snake</span>
      </h1>
      <p class="text-ts font-mono text-xs sm:text-sm">
        Recolecta paquetes de datos sin colisionar con el cortafuegos.
      </p>
    </div>

    <!-- Score Bar -->
    <div class="w-full max-w-[500px] flex items-center justify-between bg-[#0e0e1a]/90 border border-[#1e1e32] px-4 py-2.5 rounded-lg mb-4 font-mono text-xs sm:text-sm shadow-lg">
      <div class="flex items-center gap-2">
        <span class="text-ts">DATOS:</span>
        <span id="scoreDisplay" class="text-accent font-bold text-base">0</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-ts">RÉCORD:</span>
        <span id="highScoreDisplay" class="text-cyan font-bold text-base">0</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-ts">VEL:</span>
        <span id="speedDisplay" class="text-magenta font-bold">1.0x</span>
      </div>
    </div>

    <!-- Canvas Frame -->
    <div class="relative flex justify-center">
      <canvas id="snakeCanvas" width="480" height="480" class="border border-cyan/40 rounded-lg shadow-[0_0_30px_rgba(0,255,240,0.15)] bg-[#050508] max-w-full block"></canvas>
      
      <!-- Overlay Screen for Game Over / Start -->
      <div id="gameOverlay" class="absolute inset-0 bg-[#050508]/85 backdrop-blur-sm rounded-lg flex flex-col items-center justify-center p-6 text-center font-mono">
        <h2 id="overlayTitle" class="text-3xl sm:text-4xl font-bold text-cyan mb-2 tracking-wider">NEON SNAKE</h2>
        <p id="overlaySub" class="text-ts text-xs sm:text-sm mb-6 max-w-xs">Usa las flechas o W/A/S/D para guiar el agente binario.</p>
        <button id="btnStart" class="px-8 py-2.5 bg-gradient-to-r from-accent to-cyan text-black font-bold text-sm rounded shadow-[0_0_20px_rgba(0,255,135,0.4)] hover:brightness-110 active:scale-95 transition-all">
          INICIAR MISIÓN
        </button>
      </div>
    </div>

    <!-- Mobile D-PAD -->
    <div class="mt-6 flex flex-col items-center gap-1.5 sm:hidden">
      <button class="dpad-btn" id="dpadUp">▲</button>
      <div class="flex gap-4">
        <button class="dpad-btn" id="dpadLeft">◀</button>
        <button class="dpad-btn" id="dpadDown">▼</button>
        <button class="dpad-btn" id="dpadRight">▶</button>
      </div>
    </div>

    <p class="font-mono text-ts text-xs mt-6 text-center">
      Controles: <kbd class="px-1.5 py-0.5 bg-[#1a1a28] rounded border border-border text-cyan">W / A / S / D</kbd> o <kbd class="px-1.5 py-0.5 bg-[#1a1a28] rounded border border-border text-cyan">Flechas</kbd>. Espacio para Pausa.
    </p>
  </main>

  <script>
    // Audio FX
    class SnakeAudio {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }
      playEat() {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, now); // D5
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.08); // A5
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.09);
      }
      playCrash() {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(55, now + 0.3);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.35);
      }
    }

    const sound = new SnakeAudio();

    const canvas = document.getElementById('snakeCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const highScoreDisplay = document.getElementById('highScoreDisplay');
    const speedDisplay = document.getElementById('speedDisplay');
    const gameOverlay = document.getElementById('gameOverlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlaySub = document.getElementById('overlaySub');
    const btnStart = document.getElementById('btnStart');

    const GRID_SIZE = 20; // 24 x 24 cells for 480px
    const TILES = canvas.width / GRID_SIZE;

    let snake = [];
    let direction = { x: 1, y: 0 };
    let nextDirection = { x: 1, y: 0 };
    let food = { x: 15, y: 15, type: 'normal' };
    let particles = [];
    let score = 0;
    let highScore = parseInt(localStorage.getItem('lab_neon_snake_highscore') || '0', 10);
    highScoreDisplay.textContent = highScore;

    let isPlaying = false;
    let isPaused = false;
    let gameLoopTimeout = null;
    let baseSpeed = 110; // ms per step

    function resetGame() {
      snake = [
        { x: 8, y: 12 },
        { x: 7, y: 12 },
        { x: 6, y: 12 }
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      particles = [];
      scoreDisplay.textContent = '0';
      speedDisplay.textContent = '1.0x';
      spawnFood();
    }

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food.x = Math.floor(Math.random() * TILES);
        food.y = Math.floor(Math.random() * TILES);
        valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }
      food.type = Math.random() < 0.25 ? 'bonus' : 'normal';
    }

    function spawnParticles(x, y, color) {
      for (let i = 0; i < 16; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3 + 1;
        particles.push({
          x: x * GRID_SIZE + GRID_SIZE / 2,
          y: y * GRID_SIZE + GRID_SIZE / 2,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: Math.random() * 2.5 + 1.5,
          color: color,
          alpha: 1,
          decay: Math.random() * 0.04 + 0.02
        });
      }
    }

    function update() {
      if (!isPlaying || isPaused) return;

      direction = nextDirection;
      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

      // Wall collision
      if (head.x < 0 || head.x >= TILES || head.y < 0 || head.y >= TILES) {
        gameOver();
        return;
      }

      // Self collision
      if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      // Check food
      if (head.x === food.x && head.y === food.y) {
        const points = food.type === 'bonus' ? 30 : 10;
        score += points;
        scoreDisplay.textContent = score;

        if (score > highScore) {
          highScore = score;
          highScoreDisplay.textContent = highScore;
          localStorage.setItem('lab_neon_snake_highscore', highScore);
        }

        sound.playEat();
        spawnParticles(food.x, food.y, food.type === 'bonus' ? '#ff00c8' : '#00fff0');
        spawnFood();

        // Speed calculation
        const speedMul = (1 + Math.min(score / 200, 1.2)).toFixed(1);
        speedDisplay.textContent = `${speedMul}x`;
      } else {
        snake.pop();
      }

      render();

      const currentDelay = Math.max(45, baseSpeed - Math.floor(score / 15) * 4);
      gameLoopTimeout = setTimeout(update, currentDelay);
    }

    function render() {
      // Clear
      ctx.fillStyle = '#050508';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid backdrop
      ctx.strokeStyle = 'rgba(0, 255, 240, 0.03)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= canvas.width; i += GRID_SIZE) {
        ctx.beginPath();
        ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
      }

      // Draw Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Draw Food
      const fx = food.x * GRID_SIZE + GRID_SIZE / 2;
      const fy = food.y * GRID_SIZE + GRID_SIZE / 2;
      const foodColor = food.type === 'bonus' ? '#ff00c8' : '#00fff0';

      ctx.save();
      ctx.shadowBlur = 15;
      ctx.shadowColor = foodColor;
      ctx.fillStyle = foodColor;
      ctx.beginPath();
      ctx.arc(fx, fy, GRID_SIZE / 2.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Draw Snake Body
      snake.forEach((seg, idx) => {
        const x = seg.x * GRID_SIZE;
        const y = seg.y * GRID_SIZE;
        const isHead = idx === 0;

        ctx.save();
        if (isHead) {
          ctx.fillStyle = '#00ff87';
          ctx.shadowBlur = 18;
          ctx.shadowColor = '#00ff87';
        } else {
          const ratio = 1 - (idx / snake.length) * 0.5;
          ctx.fillStyle = `rgba(0, 255, 240, ${ratio})`;
          ctx.shadowBlur = 8;
          ctx.shadowColor = 'rgba(0, 255, 240, 0.4)';
        }

        const pad = 1.5;
        ctx.fillRect(x + pad, y + pad, GRID_SIZE - pad * 2, GRID_SIZE - pad * 2);
        ctx.restore();
      });
    }

    function gameOver() {
      isPlaying = false;
      sound.playCrash();
      clearTimeout(gameLoopTimeout);
      overlayTitle.textContent = 'MISIÓN FALLIDA';
      overlayTitle.className = 'text-3xl sm:text-4xl font-bold text-magenta mb-2 tracking-wider';
      overlaySub.textContent = `Puntuación obtenida: ${score} bits.`;
      btnStart.textContent = 'REINTENTAR';
      gameOverlay.style.display = 'flex';
    }

    function startGame() {
      resetGame();
      isPlaying = true;
      isPaused = false;
      gameOverlay.style.display = 'none';
      sound.init();
      update();
    }

    btnStart.addEventListener('click', startGame);

    // Direction input
    function setDirection(dx, dy) {
      if (!isPlaying) return;
      // Prevent 180-degree turn
      if (dx !== 0 && direction.x !== 0) return;
      if (dy !== 0 && direction.y !== 0) return;
      nextDirection = { x: dx, y: dy };
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
        e.preventDefault();
      }

      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') setDirection(0, -1);
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') setDirection(0, 1);
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') setDirection(-1, 0);
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') setDirection(1, 0);

      if (e.code === 'Space' && isPlaying) {
        isPaused = !isPaused;
        if (!isPaused) update();
      }
    });

    // Mobile D-Pad handlers
    document.getElementById('dpadUp').addEventListener('click', () => setDirection(0, -1));
    document.getElementById('dpadDown').addEventListener('click', () => setDirection(0, 1));
    document.getElementById('dpadLeft').addEventListener('click', () => setDirection(-1, 0));
    document.getElementById('dpadRight').addEventListener('click', () => setDirection(1, 0));

    // Initial render
    resetGame();
    render();
  </script>
</body>
</html>
